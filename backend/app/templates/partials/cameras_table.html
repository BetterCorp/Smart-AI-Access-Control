<section id="camera-table" class="panel">
  <h3>Configured Cameras</h3>
  <table>
    <thead><tr><th>Name</th><th>Host</th><th>FPS</th><th>Actions</th></tr></thead>
    <tbody>
      {% for camera in cameras %}
      <tr>
        <td>{{ camera.name }}</td>
        <td>{{ camera.host }}:{{ camera.port }}</td>
        <td>{{ camera.analytics_fps }}</td>
        <td>
          <button hx-post="/ui/cameras/{{ camera.id }}/test" hx-target="#camera-test-result">Test</button>
          <button hx-post="/ui/cameras/{{ camera.id }}/delete" hx-target="#camera-table" hx-swap="outerHTML">Delete</button>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">No cameras configured.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <div id="camera-test-result"></div>
</section>
