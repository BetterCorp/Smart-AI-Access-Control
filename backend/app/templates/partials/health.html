<h3>System Health</h3>
<dl class="health-grid">
  <dt>Status</dt><dd>{% if health.ok %}OK{% else %}Fault{% endif %}</dd>
  <dt>Cameras</dt><dd>{{ health.cameras }}</dd>
  <dt>Rules</dt><dd>{{ health.rules }}</dd>
  <dt>Relays</dt><dd>{{ health.relays }}</dd>
  <dt>Events</dt><dd>{{ health.events }}</dd>
  <dt>Mock inference</dt><dd>{{ health.mockInference }}</dd>
  <dt>Relay hardware</dt><dd>{{ health.relayHardware }}</dd>
  <dt>Database</dt><dd><code>{{ health.db }}</code></dd>
</dl>
