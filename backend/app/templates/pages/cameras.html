{% extends "base.html" %}
{% block title %}Cameras - Smart AI{% endblock %}
{% block content %}
<section class="page-header">
  <h2>Cameras</h2>
</section>
<form class="panel form-grid" hx-post="/ui/cameras" hx-target="#camera-table" hx-swap="outerHTML">
  <label>Name <input name="name" required></label>
  <label>Host <input name="host" required placeholder="192.168.1.50"></label>
  <label>Port <input name="port" type="number" value="554" min="1" max="65535"></label>
  <label>Username <input name="username"></label>
  <label>Password <input name="password" type="password"></label>
  <label>Path <input name="path" required placeholder="/Streaming/Channels/102"></label>
  <label>Transport
    <select name="transport">
      <option value="tcp">TCP</option>
      <option value="udp">UDP</option>
    </select>
  </label>
  <label>Analytics FPS <input name="analytics_fps" type="number" value="2" min="0.2" max="5" step="0.1"></label>
  <button type="submit">Add Camera</button>
</form>
{% include "partials/cameras_table.html" %}
{% endblock %}
